[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guralp-downloader"
version = "0.1.0"
description = "Download day-chunked miniseed data from Guralp Certimus/Minimus sensors."
requires-python = ">=3.10"
dependencies = [
  "obspy",
  "PyYAML",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
